# ==========================================
# 0. RBAC PERMISSIONS
# ==========================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-service-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-service-role
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-service-rolebinding
subjects:
  - kind: ServiceAccount
    name: config-service-sa
roleRef:
  kind: Role
  name: config-service-role
  apiGroup: rbac.authorization.k8s.io

---
# ==========================================
# 1. USER SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: thanhieub2305573/user-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: backend-secrets
        - configMapRef:
            name: user-service-config
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  type: LoadBalancer
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: user-service

