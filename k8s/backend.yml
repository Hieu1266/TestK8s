# ==========================================
# 5. CONFIG SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  labels:
    app: config-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
    spec:
      serviceAccountName: config-service-sa
      containers:
      - name: config-service
        image: thanhieub2305573/config-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8004
        env:
        - name: PORT
          value: "8004"
        envFrom:
        - secretRef:
            name: backend-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: config-service
spec:
  type: LoadBalancer
  ports:
    - port: 8005
      targetPort: 8004
  selector:
    app: config-service